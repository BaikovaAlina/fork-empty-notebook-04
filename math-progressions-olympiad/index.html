<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Прогрессии — олимпиадный практикум · 10–11 класс</title>
<meta name="description" content="Интерактивная презентация: 12 задач на арифметическую и геометрическую прогрессии из перечневых олимпиад (ПВГ, Ломоносов, Физтех, Высшая проба, ОММО) с подсказками, решениями и проверкой ответов.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
<style>
  :root{
    --bg:#f5f3ee; --card:#ffffff; --ink:#243041; --muted:#6b7686;
    --accent:#4f46e5; --accent-soft:#eef2ff; --accent-ink:#3730a3;
    --teal:#0d9488; --teal-soft:#f0fdfa;
    --amber:#b45309; --amber-soft:#fffbeb;
    --green:#15803d; --green-soft:#f0fdf4;
    --red:#b91c1c; --red-soft:#fef2f2;
    --line:#e5e1d8; --radius:16px;
    --shadow:0 10px 30px rgba(36,48,65,.08);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PT Sans","Helvetica Neue",Arial,sans-serif;
    font-size:17px; line-height:1.6;
    display:flex; flex-direction:column; min-height:100vh;
  }
  /* ---------- header ---------- */
  .topbar{
    position:sticky; top:0; z-index:50; background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:960px; margin:0 auto; padding:10px 16px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .brand{font-weight:700; font-size:15px; color:var(--accent-ink); white-space:nowrap}
  .top-right{margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .chip{
    font-size:13px; font-weight:600; padding:4px 10px; border-radius:999px;
    background:var(--green-soft); color:var(--green); border:1px solid #bbf7d0; white-space:nowrap;
  }
  #jump{
    font:inherit; font-size:13px; max-width:190px; padding:5px 8px;
    border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink);
  }
  .progress{height:4px; background:#e9e5dc}
  #progressFill{height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--teal)); transition:width .3s}
  /* ---------- deck ---------- */
  main{flex:1; width:100%; max-width:960px; margin:0 auto; padding:22px 16px 30px}
  .slide{display:none; animation:fadein .28s ease}
  .slide.active{display:block}
  @keyframes fadein{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:26px 28px;
  }
  @media (max-width:600px){ .card{padding:20px 16px} body{font-size:16px} }
  /* ---------- title slide ---------- */
  .kicker{font-size:13px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--teal)}
  h1{font-size:clamp(34px,7vw,54px); line-height:1.1; margin:10px 0 6px; color:var(--accent-ink)}
  .subtitle{font-size:clamp(17px,2.6vw,21px); color:var(--muted); margin:0 0 18px}
  .chips{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0}
  .tag{font-size:13px; font-weight:600; padding:5px 12px; border-radius:999px; background:var(--accent-soft); color:var(--accent-ink)}
  .tag.t2{background:var(--teal-soft); color:var(--teal)}
  .formula-strip{
    font-family:Georgia,"Times New Roman",serif; font-style:italic; text-align:center;
    background:linear-gradient(90deg,var(--accent-soft),var(--teal-soft));
    border-radius:12px; padding:12px; margin:18px 0; font-size:18px; color:#3b4a63;
  }
  .howto{margin:18px 0; padding:0 0 0 20px}
  .howto li{margin:7px 0}
  .note{font-size:14px; color:var(--muted)}
  /* ---------- buttons ---------- */
  .btn{
    font:inherit; font-size:15px; font-weight:600; cursor:pointer;
    border-radius:10px; padding:10px 18px; min-height:44px;
    border:1px solid transparent; transition:transform .08s, box-shadow .15s;
  }
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--accent); color:#fff}
  .btn-primary:hover{box-shadow:0 6px 16px rgba(79,70,229,.35)}
  .btn-ghost{background:#fff; border-color:var(--line); color:var(--ink)}
  .btn-ghost:hover{border-color:var(--accent)}
  .btn-hint{background:var(--amber-soft); color:var(--amber); border-color:#fde68a}
  .btn-sol{background:var(--teal-soft); color:var(--teal); border-color:#99f6e4}
  .btn[disabled]{opacity:.45; cursor:default; box-shadow:none}
  .btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px}
  /* ---------- problem ---------- */
  .p-head{display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap; margin-bottom:14px}
  .p-num{
    flex:0 0 auto; width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    background:var(--accent); color:#fff; font-weight:800; font-size:19px;
  }
  .p-meta{display:flex; flex-direction:column; gap:4px; min-width:0}
  .p-source{font-size:14px; font-weight:700; color:var(--accent-ink)}
  .p-source a{color:inherit; text-decoration:none; border-bottom:1px dotted var(--accent-ink)}
  .p-details{font-size:12.5px; color:var(--muted)}
  .p-badges{margin-left:auto; display:flex; gap:6px; align-items:center; flex-wrap:wrap}
  .badge{font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px}
  .badge.topic{background:var(--teal-soft); color:var(--teal); border:1px solid #99f6e4}
  .badge.diff{background:var(--amber-soft); color:var(--amber); border:1px solid #fde68a; letter-spacing:2px}
  .p-title{font-size:21px; margin:2px 0 10px; color:var(--ink)}
  .p-text{font-size:17.5px}
  .p-text p{margin:10px 0}
  .answer-box{
    margin-top:20px; padding:16px; border:1.5px dashed #c7d2fe; border-radius:12px; background:#fafaff;
  }
  .answer-box label{font-size:14px; font-weight:700; color:var(--accent-ink); display:block; margin-bottom:8px}
  .answer-row{display:flex; gap:8px; flex-wrap:wrap}
  .answer-row input{
    flex:1 1 220px; font:inherit; font-size:16px; padding:10px 14px; min-height:44px;
    border:1.5px solid var(--line); border-radius:10px; background:#fff; color:var(--ink);
  }
  .answer-row input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .answer-row input.ok{border-color:var(--green); background:var(--green-soft)}
  .answer-row input.bad{border-color:var(--red); background:var(--red-soft)}
  .format-hint{font-size:12.5px; color:var(--muted); margin-top:8px}
  .feedback{margin-top:10px; font-weight:600; font-size:15px; min-height:22px}
  .feedback.ok{color:var(--green)} .feedback.bad{color:var(--red)} .feedback.warn{color:var(--amber)}
  .reveal{display:none; margin-top:16px; border-radius:12px; padding:16px 18px; font-size:16px}
  .reveal.open{display:block; animation:fadein .25s ease}
  .reveal h4{margin:0 0 8px; font-size:15px}
  .hint-box{background:var(--amber-soft); border:1px solid #fde68a; border-left:5px solid #f59e0b}
  .hint-box h4{color:var(--amber)}
  .sol-box{background:var(--teal-soft); border:1px solid #99f6e4; border-left:5px solid var(--teal)}
  .sol-box h4{color:var(--teal)}
  .sol-box ol{margin:8px 0; padding-left:22px}
  .sol-box li{margin:8px 0}
  .final-answer{
    margin-top:12px; padding:10px 14px; background:#fff; border:1px solid #99f6e4;
    border-radius:10px; font-weight:700; color:var(--teal);
  }
  /* ---------- math ---------- */
  .f{font-family:Georgia,"Times New Roman",serif; font-style:italic; white-space:nowrap}
  .fw{font-family:Georgia,"Times New Roman",serif; font-style:italic}
  .f sub,.f sup,.fw sub,.fw sup{font-size:.72em}
  .frac{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; font-size:.9em; line-height:1.2; margin:0 2px}
  .frac .den{border-top:1.5px solid currentColor}
  .ovl{text-decoration:overline}
  .formula{
    font-family:Georgia,"Times New Roman",serif; font-style:italic;
    background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px;
    padding:10px 14px; margin:10px 0; overflow-x:auto; font-size:17px;
  }
  /* ---------- theory ---------- */
  .theory-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px}
  @media (max-width:700px){ .theory-grid{grid-template-columns:1fr} }
  .theory-card{border:1px solid var(--line); border-radius:12px; padding:16px 18px; background:#fcfbf8}
  .theory-card h3{margin:0 0 8px; font-size:17px; color:var(--accent-ink)}
  .theory-card.gp h3{color:var(--teal)}
  .theory-card ul{margin:6px 0; padding-left:18px}
  .theory-card li{margin:6px 0}
  .tricks{margin-top:16px; background:var(--accent-soft); border-radius:12px; padding:16px 18px}
  .tricks h3{margin:0 0 8px; font-size:16px; color:var(--accent-ink)}
  .tricks li{margin:6px 0}
  /* ---------- summary ---------- */
  .score-banner{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:linear-gradient(90deg,var(--accent-soft),var(--teal-soft));
    border-radius:12px; padding:16px 18px; margin:14px 0;
  }
  .score-num{font-size:34px; font-weight:800; color:var(--accent-ink)}
  table.results{width:100%; border-collapse:collapse; font-size:14.5px; margin-top:10px}
  table.results th{
    text-align:left; font-size:12.5px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--muted); padding:8px 10px; border-bottom:2px solid var(--line);
  }
  table.results td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top}
  table.results tr.rowlink{cursor:pointer}
  table.results tr.rowlink:hover td{background:var(--accent-soft)}
  .st{font-weight:700; white-space:nowrap}
  .st.ok{color:var(--green)} .st.bad{color:var(--red)} .st.none{color:var(--muted)}
  .seen{font-size:12px; color:var(--muted); white-space:nowrap}
  .ans-cell{font-weight:600}
  details.sources{margin-top:18px; border:1px solid var(--line); border-radius:12px; padding:12px 16px; background:#fcfbf8}
  details.sources summary{cursor:pointer; font-weight:700; color:var(--accent-ink)}
  details.sources ul{padding-left:20px; font-size:14px}
  details.sources li{margin:6px 0}
  details.sources a{color:var(--accent)}
  .table-wrap{overflow-x:auto}
  /* ---------- footer nav ---------- */
  .navbar{
    position:sticky; bottom:0; z-index:50; background:rgba(255,255,255,.95);
    backdrop-filter:blur(8px); border-top:1px solid var(--line);
  }
  .navbar-inner{
    max-width:960px; margin:0 auto; padding:10px 16px;
    display:flex; align-items:center; gap:12px;
  }
  #counter{margin:0 auto; font-size:14px; font-weight:700; color:var(--muted); white-space:nowrap}
  .nav-hint{font-size:11.5px; color:var(--muted); text-align:center; padding:0 16px 6px}
  @media (max-width:600px){
    .nav-hint{display:none}
    .brand{font-size:13px}
    #jump{max-width:130px}
    .p-badges{margin-left:0}
  }
  /* ---------- print ---------- */
  @media print{
    .topbar,.navbar,.btn-row,.answer-box .btn,.nav-hint{display:none !important}
    body{background:#fff}
    main{max-width:100%; padding:0}
    .slide{display:block !important; page-break-after:always; animation:none}
    .card{box-shadow:none; border:none; padding:10px 0}
    .reveal{display:block !important}
    .answer-box{border:none; background:none; padding:0}
    .answer-row{display:none}
    a{color:inherit; text-decoration:none}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">📐 Прогрессии · олимпиадный практикум</div>
    <div class="top-right">
      <span class="chip" id="solvedChip">Верно: 0 / 12</span>
      <select id="jump" aria-label="Перейти к слайду"></select>
    </div>
  </div>
  <div class="progress"><div id="progressFill"></div></div>
</header>

<main id="deck" aria-live="polite"></main>

<footer class="navbar">
  <div class="navbar-inner">
    <button class="btn btn-ghost" id="prevBtn">← Назад</button>
    <div id="counter">1 / 15</div>
    <button class="btn btn-primary" id="nextBtn">Вперёд →</button>
  </div>
  <div class="nav-hint">Листайте стрелками ← → на клавиатуре или свайпом на телефоне</div>
</footer>

<noscript><div style="max-width:700px;margin:30px auto;padding:20px;background:#fff;border-radius:12px">
  Для работы практикума нужен JavaScript. Включите его в браузере и обновите страницу.
</div></noscript>

<script>
"use strict";
/* =====================================================================
   ДАННЫЕ: 12 задач перечневых олимпиад на прогрессии.
   Условия — по открытым архивам (см. «Источники» на последнем слайде);
   подсказки и решения подготовлены для этого практикума и проверены
   символьно и подстановкой (tools/verify.py в репозитории).
   ===================================================================== */
const PROBLEMS = [
{
  id:"p1", diff:1, topic:"геометрическая",
  title:"Отношение сумм",
  source:"«Покори Воробьёвы горы!»", year:"2019", grade:"10–11 классы", stage:"",
  url:"https://mathus.ru/math/posled.pdf",
  text:`<p>Сумма шести первых членов геометрической прогрессии, состоящей из положительных чисел,
        в <b>344 раза</b> больше суммы трёх её первых членов. Найдите знаменатель прогрессии.</p>`,
  placeholder:"Например: 7",
  format:"Ответ — одно число.",
  hint:`<p>Разбейте сумму шести членов на два блока по три. Второй блок — это первый, у которого каждый член умножен на одно и то же число. Какое?</p>`,
  solution:`<ol>
    <li>Запишем: <span class="f">S<sub>6</sub> = (b<sub>1</sub>+b<sub>2</sub>+b<sub>3</sub>) + (b<sub>4</sub>+b<sub>5</sub>+b<sub>6</sub>)</span>.
        Так как <span class="f">b<sub>4</sub>=b<sub>1</sub>q<sup>3</sup></span>, <span class="f">b<sub>5</sub>=b<sub>2</sub>q<sup>3</sup></span>, <span class="f">b<sub>6</sub>=b<sub>3</sub>q<sup>3</sup></span>,
        получаем <span class="f">S<sub>6</sub> = S<sub>3</sub>(1+q<sup>3</sup>)</span>.</li>
    <li>По условию <span class="f">S<sub>3</sub>(1+q<sup>3</sup>) = 344·S<sub>3</sub></span>. Все члены положительны, поэтому <span class="f">S<sub>3</sub> &gt; 0</span> и на него можно сократить:
        <span class="f">1+q<sup>3</sup> = 344</span>.</li>
    <li>Отсюда <span class="f">q<sup>3</sup> = 343 = 7<sup>3</sup></span>, значит <span class="f">q = 7</span>.</li>
  </ol>`,
  answer:"7", check:{type:"num", values:[7]}
},
{
  id:"p2", diff:1, topic:"геометрическая",
  title:"Пять плюс пять",
  source:"«Покори Воробьёвы горы!»", year:"2016", grade:"10–11 классы", stage:"",
  url:"https://mathus.ru/math/posled.pdf",
  text:`<p>Сумма пяти первых членов геометрической прогрессии равна <b>93</b>, а сумма следующих пяти членов равна <b>2976</b>.
        Найдите сумму первых семи членов прогрессии.</p>`,
  placeholder:"Например: 381",
  format:"Ответ — одно число.",
  hint:`<p>Каждый член второго блока из пяти в <span class="f">q<sup>5</sup></span> раз больше соответствующего члена первого блока. Найдите сначала <span class="f">q</span>, потом <span class="f">b<sub>1</sub></span>.</p>`,
  solution:`<ol>
    <li><span class="f">b<sub>6</sub>+…+b<sub>10</sub> = q<sup>5</sup>(b<sub>1</sub>+…+b<sub>5</sub>)</span>, поэтому
        <span class="f">q<sup>5</sup> = 2976/93 = 32</span>, откуда <span class="f">q = 2</span>.</li>
    <li><span class="f">S<sub>5</sub> = b<sub>1</sub>(2<sup>5</sup>−1)/(2−1) = 31b<sub>1</sub> = 93</span>, значит <span class="f">b<sub>1</sub> = 3</span>.</li>
    <li><span class="f">S<sub>7</sub> = 3·(2<sup>7</sup>−1)/(2−1) = 3·127 = 381</span>.</li>
  </ol>`,
  answer:"381", check:{type:"num", values:[381]}
},
{
  id:"p3", diff:2, topic:"геометрическая",
  title:"Модуль в прогрессии",
  source:"«Физтех»", year:"2016", grade:"10 класс", stage:"",
  url:"https://mathus.ru/math/posled.pdf",
  text:`<p>Найдите все значения <span class="f">p</span>, при каждом из которых числа
        <span class="f">4p+5</span>, <span class="f">2p</span> и <span class="f">|p−3|</span>
        являются соответственно первым, вторым и третьим членами некоторой геометрической прогрессии.</p>`,
  placeholder:"Например: -1; 15/8",
  format:"Несколько значений вводите через точку с запятой (;). Дроби — как 15/8 или 1,875.",
  hint:`<p>Характеристическое свойство: квадрат среднего члена равен произведению крайних. Раскройте модуль в двух случаях. И не забудьте: члены геометрической прогрессии не могут быть нулями.</p>`,
  solution:`<ol>
    <li>Члены ГП ненулевые: <span class="f">p ≠ 0</span>, <span class="f">p ≠ −5/4</span>, <span class="f">p ≠ 3</span>.
        Условие: <span class="f">(2p)<sup>2</sup> = (4p+5)·|p−3|</span>.</li>
    <li><b>Случай <span class="f">p &lt; 3</span>:</b> <span class="f">4p<sup>2</sup> = (4p+5)(3−p)</span>
        ⟹ <span class="f">8p<sup>2</sup> − 7p − 15 = 0</span>, <span class="f">D = 49 + 480 = 529 = 23<sup>2</sup></span>,
        <span class="f">p = (7 ± 23)/16</span>: получаем <span class="f">p = 15/8</span> или <span class="f">p = −1</span>. Оба меньше 3.</li>
    <li><b>Случай <span class="f">p &gt; 3</span>:</b> <span class="f">4p<sup>2</sup> = (4p+5)(p−3)</span>
        ⟹ <span class="f">0 = −7p − 15</span> ⟹ <span class="f">p = −15/7</span> — не удовлетворяет <span class="f">p &gt; 3</span>, отбрасываем.</li>
    <li><b>Проверка.</b> При <span class="f">p = −1</span>: числа 1, −2, 4 — ГП со знаменателем −2. ✓<br>
        При <span class="f">p = 15/8</span>: числа 12,5; 3,75; 1,125 — ГП со знаменателем 0,3. ✓
        (При ненулевых крайних членах равенство <span class="f">b<sub>2</sub><sup>2</sup>=b<sub>1</sub>b<sub>3</sub></span> достаточно: тогда <span class="f">b<sub>3</sub> = b<sub>2</sub>·(b<sub>2</sub>/b<sub>1</sub>)</span>.)</li>
  </ol>`,
  answer:"−1; 15/8 (= 1,875)", check:{type:"num", values:[-1, 1.875]}
},
{
  id:"p4", diff:2, topic:"геометрическая",
  title:"Сумма до бесконечности",
  source:"«Покори Воробьёвы горы!»", year:"2017", grade:"10–11 классы", stage:"",
  url:"https://mathus.ru/math/posled.pdf",
  text:`<p>Найдите сумму бесконечно убывающей геометрической прогрессии, если её второй член равен <b>3</b>,
        а сумма первых трёх её членов равна <b>13</b>.</p>`,
  placeholder:"Например: 13,5 или 27/2",
  format:"Ответ — число (десятичная дробь или обыкновенная).",
  hint:`<p>Выразите всё через знаменатель: <span class="f">b<sub>1</sub> = 3/q</span>, <span class="f">b<sub>3</sub> = 3q</span>. Получится квадратное уравнение с двумя корнями — «бесконечно убывающая» означает <span class="f">|q| &lt; 1</span>, это и выберет нужный.</p>`,
  solution:`<ol>
    <li><span class="f">3/q + 3 + 3q = 13</span>. Умножим на <span class="f">q</span>:
        <span class="f">3q<sup>2</sup> − 10q + 3 = 0</span>, <span class="f">D = 100 − 36 = 64</span>,

{
  id:"p7", diff:2, topic:"арифметическая",
  title:"Во сколько раз изменится сумма?",
  source:"«Физтех»", year:"2020", grade:"10 класс", stage:"",
  url:"https://mathus.ru/math/posled.pdf",
  text:`<p>Дана конечная арифметическая прогрессия <span class="f">a<sub>1</sub>, a<sub>2</sub>, …, a<sub>n</sub></span>
        с положительной разностью, причём сумма всех её членов равна <span class="f">S</span>, а <span class="f">a<sub>1</sub> &gt; 0</span>.
        Известно, что если разность прогрессии увеличить в 3 раза, а её первый член оставить неизменным,
        то сумма <span class="f">S</span> увеличится в 2 раза.
        А во сколько раз увеличится <span class="f">S</span>, если разность исходной прогрессии увеличить в 4 раза
        (оставив первый член неизменным)?</p>`,
  placeholder:"Например: 2,5 или 5/2",
  format:"Ответ — число (во сколько раз).",
  hint:`<p>В формуле <span class="f">S = n·a<sub>1</sub> + n(n−1)d/2</span> сумма состоит из двух частей: <span class="f">A = n·a<sub>1</sub></span> не зависит от <span class="f">d</span>, а <span class="f">B = n(n−1)d/2</span> пропорциональна <span class="f">d</span>. Что происходит с A и B при утроении разности?</p>`,
  solution:`<ol>
    <li><span class="f">S = n·a<sub>1</sub> + n(n−1)d/2 = A + B</span>, где <span class="f">A = n·a<sub>1</sub> &gt; 0</span>,
        <span class="f">B = n(n−1)d/2 &gt; 0</span> (здесь <span class="f">n ≥ 2</span>, иначе сумма не менялась бы).</li>
    <li>Утроение разности утраивает только <span class="f">B</span>: <span class="f">A + 3B = 2(A+B)</span> ⟹ <span class="f">B = A</span>,
        то есть <span class="f">S = 2A</span>.</li>
    <li>Учетверение разности: новая сумма <span class="f">A + 4B = 5A</span>.
        Отношение: <span class="f">5A / 2A = 5/2</span>.</li>
    <li>Ответ не зависит от конкретных <span class="f">n</span>, <span class="f">a<sub>1</sub></span>, <span class="f">d</span> — такова сила «разложения на блоки».</li>
  </ol>`,
  answer:"в 5/2 раза (= 2,5)", check:{type:"num", values:[2.5]}
},
{

  url:"https://mathus.ru/math/posled.pdf",
  text:`<p>Сумма бесконечно убывающей геометрической прогрессии <span class="f">b<sub>1</sub>, b<sub>2</sub>, b<sub>3</sub>, …</span>

        Найдите сумму новой бесконечно убывающей геометрической прогрессии, у которой первый член равен

  hint:`<p>Квадраты членов — тоже бесконечно убывающая ГП: первый член <span class="f">b<sub>1</sub><sup>2</sup></span>, знаменатель <span class="f">q<sup>2</sup></span>. Поделите уравнение для квадратов на уравнение для суммы, разложив <span class="f">1−q<sup>2</sup> = (1−q)(1+q)</span>.</p>`,
  solution:`<ol>

    <li>Делим второе на первое: <span class="f">b<sub>1</sub>(1−q)/((1−q)(1+q)) = b<sub>1</sub>/(1+q) = 2100/70 = 30</span>.</li>
    <li>Новая прогрессия: первый член <span class="f">−b<sub>1</sub></span>, знаменатель <span class="f">−q</span> (тоже <span class="f">|−q|&lt;1</span>), её сумма
        <span class="f">S′ = −b<sub>1</sub>/(1−(−q)) = −b<sub>1</sub>/(1+q) = −30</span>. Ответ уже получен!</li>

},

{

  solution:`<ol>

    <li>Так как <span class="f">nd ∈ [14; 16]</span>, то <span class="f">n+2 ∈ [126/16; 126/14] = [7,875; 9]</span>.

    <li><b><span class="f">n = 6</span>:</b> <span class="f">nd = 126/8 = 15,75 ∈ [14;16]</span> ✓ ⟹ <span class="f">d = 15,75/6 = 21/8 = 2,625</span>.

{

  url:"https://mathus.ru/math/posled.pdf",
  text:`<p>Числа <b>24</b> и <b>2187</b> являются членами геометрической прогрессии.

  hint:`<p>Разложите на множители: <span class="f">24 = 2<sup>3</sup>·3</span>, <span class="f">2187 = 3<sup>7</sup></span>. Если натуральный член равен <span class="f">x = 2<sup>u</sup>·3<sup>v</sup></span>, проследите, как меняются показатели. Величина <span class="f">2u+v</span> окажется одинаковой у всех натуральных членов!</p>`,
  solution:`<ol>
    <li>Пусть <span class="f">24 = b<sub>m</sub></span>, <span class="f">2187 = b<sub>n</sub></span>, <span class="f">j = n−m ≠ 0</span>.

    <li>Пусть <span class="f">x</span> — натуральный член, <span class="f">x = 24·q<sup>i</sup></span>. Возведём в степень <span class="f">j</span>:
        <span class="f">x<sup>j</sup> = 24<sup>j</sup>·(q<sup>j</sup>)<sup>i</sup> = 2<sup>3j−3i</sup>·3<sup>j+6i</sup></span>.

    <li>Сравниваем показатели: <span class="f">uj = 3j−3i</span>, <span class="f">vj = j+6i</span>. Тогда

    <li>Целые неотрицательные решения: <span class="f">(u,v) = (0,7), (1,5), (2,3), (3,1)</span>, что даёт

{

  url:"https://www.reshuolymp.ru/problem?id=33",
  text:`<p>Три различных положительных числа являются тремя последовательными членами арифметической прогрессии.
        Могут ли эти же три числа оказаться тремя (<b>не обязательно последовательными</b>) членами геометрической прогрессии?

  format:"Введите «да» или «нет». Обоснование напишите в тетради, затем сверьте с решением.",
  hint:`<p>Ищите пример среди членов ГП <span class="f">1, q, q<sup>2</sup>, q<sup>3</sup>, …</span>: пусть три числа — это <span class="f">1</span>, <span class="f">q</span> и <span class="f">q<sup>3</sup></span>. Условие «средний — среднее арифметическое крайних» даёт кубическое уравнение на <span class="f">q</span>. Один из корней связан с золотым сечением.</p>`,
  solution:`<ol>
    <li><b>Ответ: да, могут.</b> Построим пример. Возьмём ГП <span class="f">b<sub>k</sub> = q<sup>k−1</sup></span>:
        числа <span class="f">1 = b<sub>1</sub></span>, <span class="f">q = b<sub>2</sub></span>, <span class="f">q<sup>3</sup> = b<sub>4</sub></span> — её члены (номера 1, 2, 4).</li>
    <li>Они образуют АП (в этом порядке), если <span class="f">2q = 1 + q<sup>3</sup></span>, то есть
        <span class="f">q<sup>3</sup> − 2q + 1 = 0</span>. Раскладываем: <span class="f">(q−1)(q<sup>2</sup>+q−1) = 0</span>.</li>
    <li>Корень <span class="f">q = 1</span> даёт одинаковые числа — не подходит. Берём положительный корень уравнения
        <span class="f">q<sup>2</sup>+q−1=0</span>: <span class="f">q = (√5−1)/2 ≈ 0,618</span> (золотое сечение!).</li>
    <li>Проверка: из <span class="f">q<sup>2</sup> = 1−q</span> следует
        <span class="f">q<sup>3</sup> = q·q<sup>2</sup> = q(1−q) = q − q<sup>2</sup> = q − (1−q) = 2q − 1</span>,
        то есть <span class="f">1 + q<sup>3</sup> = 2q</span> ✓. Числа <span class="f">1 ≈ 1</span>, <span class="f">q ≈ 0,618</span>,
        <span class="f">q<sup>3</sup> ≈ 0,236</span> различны, положительны и образуют убывающую АП с разностью <span class="f">q−1 ≈ −0,382</span>.</li>
    <li>Замечание: с <i>последовательными</i> членами ГП так бы не вышло — из <span class="f">2q = 1+q<sup>2</sup></span> следует <span class="f">q=1</span>. Поэтому в примере и нужен «пропуск» <span class="f">b<sub>3</sub></span>.</li>
  </ol>`,
  answer:"да (пример: 1, q, q³ при q = (√5−1)/2)", check:{type:"yesno", yes:true}
}
];

   ===================================================================== */
function parseNum(tok){
  let t = String(tok).trim().toLowerCase().replace(/[−–]/g,"-").replace(/\s+/g,"");
  if(!t) return null;
  t = t.replace(",", ".");
  let m = t.match(/^([+-]?\d+(?:\.\d+)?)\/([+-]?\d+(?:\.\d+)?)$/);
  if(m){ const den = parseFloat(m[2]); if(!den) return null; return parseFloat(m[1])/den; }
  if(/^[+-]?\d+(?:\.\d+)?$/.test(t)) return parseFloat(t);
  return null;
}
function checkAnswer(pr, raw){
  const s = String(raw).trim();
  if(!s) return "empty";
  if(pr.check.type === "yesno"){
    const t = s.toLowerCase().replace(/[.!?]+$/,"").trim();
    const yes = ["да","yes","могут","может","верно","+","true","ага"].includes(t);
    const no  = ["нет","no","не могут","не может","неверно","-","false"].includes(t);
    if(!yes && !no) return "unparsed";
    return (yes === pr.check.yes) ? "correct" : "wrong";
  }
  const parts = s.split(/\s*;\s*|\s+или\s+/i).map(x=>x.trim()).filter(x=>x.length);
  const vals = [];
  for(const part of parts){ const v = parseNum(part); if(v === null) return "unparsed"; vals.push(v); }
  const exp = pr.check.values;
  if(vals.length !== exp.length) return "wrong";
  const used = exp.map(()=>false);
  for(const v of vals){
    let hit = false;
    for(let i=0;i<exp.length;i++){ if(!used[i] && Math.abs(v-exp[i])<1e-6){ used[i]=true; hit=true; break; } }
    if(!hit) return "wrong";
  }
  return "correct";
}

function buildTheory(){
  const el = document.createElement("section");

    <div class="kicker">Перед стартом</div>

    <div class="theory-grid">
      <div class="theory-card">
        <h3>Арифметическая прогрессия (АП)</h3>
        <ul>
          <li><span class="f">a<sub>n</sub> = a<sub>1</sub> + (n−1)d</span></li>
          <li><span class="f">S<sub>n</sub> = <span class="frac"><span>a<sub>1</sub>+a<sub>n</sub></span><span class="den">2</span></span>·n = n·a<sub>1</sub> + <span class="frac"><span>n(n−1)</span><span class="den">2</span></span>d</span></li>
          <li>Характеристическое свойство: <span class="f">a<sub>n</sub> = <span class="frac"><span>a<sub>n−1</sub>+a<sub>n+1</sub></span><span class="den">2</span></span></span></li>
          <li>Сумма <b>линейна по d</b>: при фиксированных n и a<sub>1</sub> замена d → kd увеличивает только «d-часть» суммы.</li>
        </ul>
      </div>
      <div class="theory-card gp">
        <h3>Геометрическая прогрессия (ГП)</h3>
        <ul>

          <li>Бесконечно убывающая (<span class="f">|q| &lt; 1</span>): <span class="f">S = <span class="frac"><span>b<sub>1</sub></span><span class="den">1−q</span></span></span></li>

}

function doCheck(id){
  const pr = PROBLEMS.find(p=>p.id===id);
  const inp = document.getElementById("ans-"+id);
  const fb = document.getElementById("fb-"+id);
  const res = checkAnswer(pr, inp.value);

  if(res==="empty"){ fb.classList.add("warn"); fb.textContent="Сначала введите ответ 🙂"; return; }
  if(res==="unparsed"){
    fb.classList.add("warn");
    fb.textContent = pr.check.type==="yesno" ? "Введите «да» или «нет»." :
      "Не могу распознать ответ. Числа — как 13,5 или 27/2; несколько значений — через ;";
    return;
  }
  state.p[id].value = inp.value;
  state.p[id].status = res==="correct" ? "correct" : "wrong";
  save(); updateSolvedChip();
  if(res==="correct"){
    inp.classList.add("ok"); fb.classList.add("ok");
    fb.textContent = "✅ Верно! Отличная работа.";
  }else{
    inp.classList.add("bad"); fb.classList.add("bad");
    fb.textContent = "Пока не сходится. Проверьте вычисления, возьмите подсказку — и попробуйте ещё раз.";
  }
}
function updateSolvedChip(){
  const n = PROBLEMS.filter(pr=>state.p[pr.id].status==="correct").length;
  document.getElementById("solvedChip").textContent = `Верно: ${n} / ${N_PROB}`;
}

/* восстановление состояния задач */
PROBLEMS.forEach(pr=>{
  const st = state.p[pr.id];
  const inp = document.getElementById("ans-"+pr.id);
  const fb = document.getElementById("fb-"+pr.id);
  if(st.status==="correct"){ inp.classList.add("ok"); fb.classList.add("ok"); fb.textContent="✅ Верно! Отличная работа."; }
  else if(st.status==="wrong"){ inp.classList.add("bad"); fb.classList.add("bad"); fb.textContent="Пока не сходится. Попробуйте ещё раз или возьмите подсказку."; }
  if(st.hint){ document.getElementById("hint-"+pr.id).classList.add("open");
    document.querySelector(`[data-hint="${pr.id}"]`).textContent="💡 Скрыть подсказку"; }
  if(st.sol){ document.getElementById("sol-"+pr.id).classList.add("open");
    document.querySelector(`[data-sol="${pr.id}"]`).textContent="📖 Скрыть решение"; }
});

/* клавиатура */
window.addEventListener("keydown",(e)=>{
  const tag = (e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="select"||tag==="textarea") return;
  if(e.key==="ArrowRight"||e.key==="PageDown"){ e.preventDefault(); go(current+1); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); go(current-1); }
  else if(e.key==="Home"){ e.preventDefault(); go(0); }
  else if(e.key==="End"){ e.preventDefault(); go(TOTAL-1); }
});
/* свайпы */
let tX=null,tY=null;
deck.addEventListener("touchstart",(e)=>{
  if(e.target.closest("input,select,textarea,button,a")) { tX=null; return; }
  tX=e.touches[0].clientX; tY=e.touches[0].clientY;
},{passive:true});
deck.addEventListener("touchend",(e)=>{
  if(tX===null) return;
  const dx=e.changedTouches[0].clientX-tX, dy=e.changedTouches[0].clientY-tY;
  tX=null;
  if(Math.abs(dx)>60 && Math.abs(dx)>1.6*Math.abs(dy)) go(current + (dx<0?1:-1));
},{passive:true});
window.addEventListener("hashchange",()=>{
  const m = location.hash.match(/^#slide-(\d+)$/);
  if(m) go(parseInt(m[1],10), true);
});

/* старт */
updateSolvedChip();
{
  const m = location.hash.match(/^#slide-(\d+)$/);
  const start = m ? parseInt(m[1],10) : (state.slide||0);
  go(start, true);
}
</script>
